# Approval framework policy.
#
# Enforced at runtime by ApprovalService (backend/app/governance/
# approval_service.py, Phase 5). "checkpoints" must never be hardcoded in
# source - GovernanceProviderValidator fails startup closed if this file is
# missing, malformed, or defines zero checkpoints.
default_expiry_minutes: 1440

checkpoints:
  - id: requirement-discovery-approval
    name: Requirement Discovery Approval
    description: >-
      Human approval of discovered goals, requirements, risks, and
      assumptions before architecture design proceeds.
    required: true

  - id: architecture-approval
    name: Architecture Approval
    description: >-
      Human approval of the proposed Azure architecture before final
      output generation.
    required: true

  - id: build-review-approval
    name: Build Review Approval
    description: >-
      Human approval of the Build Agent's generated code (Workshop page)
      before the automated governance phase (security assessment, test
      generation, governance review) proceeds.
    required: true

  - id: final-output-approval
    name: Final Output Approval
    description: >-
      Human approval of the final customer-facing output before delivery.
    required: true

  - id: modernization-pr-approval
    name: Modernization Pull Request Approval
    description: >-
      Human approval of a commit-pinned modernization plan before Genie
      creates a branch, pushes generated changes, or opens a pull request.
    required: true

  - id: modernization-deployment-approval
    name: Modernization Deployment Approval
    description: >-
      Human approval of a proposed deployment strategy (target Azure
      resources, scaling, environment configuration) before Genie
      provisions real Azure resources and deploys the modernized
      repository.
    required: true

  - id: nonproduction-release-approval
    name: Non-Production Release Approval
    description: >-
      Human approval of the complete infrastructure, migration, validation,
      rollback, and cost evidence package before non-production deployment.
    required: true

  - id: production-promotion-approval
    name: Production Promotion Approval
    description: >-
      Human approval of migration rehearsal, operational readiness, staged
      rollout, reconciliation, and rollback evidence before production traffic changes.
    required: true
